    position: relative;

  el.style.marginLeft = `${(window.innerWidth  - 1920 * currentScale) / 2}px`;

const CX = 786, CY = 786, R = 786;
const GLOB_SCREEN_X = 296, GLOB_SCREEN_Y = -236;

let rotY = (Math.PI / 2) - (127.0 * Math.PI / 180);
let rotX =  (37.5  * Math.PI / 180);
let hoveredCountry = null;
let focusedCountry = null;
let activeContinents = new Set(), activeRhythms = new Set();

/* ── 필터 항목 리스트 (엔코더 E용) ── */
const FILTER_ITEMS = [
  { type:'continent', val:'Africa'      },
  { type:'continent', val:'America'     },
  { type:'continent', val:'Asia'        },
  { type:'continent', val:'Europe'      },
  { type:'continent', val:'Oceania'     },
  { type:'rhythm',    val:'Cyclical'    },
  { type:'rhythm',    val:'Free'        },
  { type:'rhythm',    val:'Poly'        },
  { type:'rhythm',    val:'Periodic'    },
  { type:'rhythm',    val:'Rhythm Mode' },
];
let filterCursor = 0;

function matchesFilter(c) {
  return (activeContinents.size === 0 || activeContinents.has(c.continent)) &&
         (activeRhythms.size    === 0 || activeRhythms.has(c.rhythm));
}

/* ── 마우스 부드러운 이동 (lerp) ── */
let mouseScreenX = 960, mouseScreenY = 540;   /* 실제 마우스 위치 */
let smoothX = 960, smoothY = 540;             /* 보간된 위치 */
let targetCircX = 960, targetCircY = 540;     /* 목표 circle 위치 */
let smoothCircX = 960, smoothCircY = 540;     /* 보간된 circle 위치 */
const MOUSE_LERP  = 0.18;  /* 포인터 라인 시차 (빠르게) */
const CIRCLE_LERP = 0.18;  /* circle도 라인과 동일하게 */

function latLonToXYZ(lat, lon, rotYr, rotXr) {
  const φ = lat * Math.PI / 180;
  const λ = (lon * Math.PI / 180) + rotYr;
  let x = Math.cos(φ) * Math.cos(λ);
  let y = Math.sin(φ);
  let z = Math.cos(φ) * Math.sin(λ);
  const y2 =  y * Math.cos(rotXr) - z * Math.sin(rotXr);
  const z2 =  y * Math.sin(rotXr) + z * Math.cos(rotXr);
  return { x, y: y2, z: z2 };
}

function project(x, y, z) {
  return { sx: CX - x * R, sy: CY - y * R, visible: z > 0 };
}

const canvas = document.getElementById('globe-canvas');
const ctx    = canvas.getContext('2d');

/* DPR 보정: 레티나 디스플레이에서 선명하게 */
const DPR = window.devicePixelRatio || 1;
canvas.width  = 1572 * DPR;
canvas.height = 1572 * DPR;
canvas.style.width  = '1572px';
canvas.style.height = '1572px';
ctx.scale(DPR, DPR);

function drawGlobe() {
  ctx.clearRect(0, 0, 1572, 1572);
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 0.8;

  for (let lon = -180; lon < 180; lon += 30) {
    ctx.beginPath(); let first = true;
    for (let lat = -90; lat <= 90; lat += 2) {
      const {x,y,z} = latLonToXYZ(lat, lon, rotY, rotX);
      const p = project(x, y, z);
      if (!p.visible) { first = true; continue; }
      if (first) { ctx.moveTo(p.sx, p.sy); first = false; } else ctx.lineTo(p.sx, p.sy);
    }
    ctx.stroke();
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath(); let first = true;
    for (let lon = -180; lon <= 180; lon += 2) {
      const {x,y,z} = latLonToXYZ(lat, lon, rotY, rotX);
      const p = project(x, y, z);
      if (!p.visible) { first = true; continue; }
      if (first) { ctx.moveTo(p.sx, p.sy); first = false; } else ctx.lineTo(p.sx, p.sy);
    }
    ctx.stroke();
  }

  COUNTRIES.forEach(c => {
    const {x,y,z} = latLonToXYZ(c.lat, c.lon, rotY, rotX);
    const p = project(x, y, z);
    if (!p.visible) return;
    const matches  = matchesFilter(c);
    const isFocused = focusedCountry && c.code === focusedCountry.code;
    const alpha = matches ? 1 : 0.2;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, isFocused ? 6 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.fill();
    if (isFocused) {
      ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
      ctx.lineWidth   = 1.5;
      ctx.stroke();
    }
    ctx.font = `400 18px "Noto Serif KR", serif`;
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.fillText(c.code, p.sx + 8, p.sy + 6);
  });

  /* 커서 원 영역만 도려내기 (겹친 부분만 투명) */
  const cx = smoothX - GLOB_SCREEN_X;
  const cy = smoothY - GLOB_SCREEN_Y;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fill();
  ctx.restore();
}

const hitarea = document.getElementById('globe-hitarea');
const ptrSvg  = document.getElementById('pointer-svg');
const ptrH    = document.getElementById('ptr-h');
const ptrV    = document.getElementById('ptr-v');
const ptrCirc = document.getElementById('ptr-circle');
const feat1   = document.getElementById('feat1');
const feat2   = document.getElementById('feat2');

/* ── 메인 루프: globe + pointer 보간 ── */
function loop() {
  /* 관성: 드래그 안 할 때 속도 감쇠 */
  if (!isDragging) {
    velY *= FRICTION; velX *= FRICTION;
    if (Math.abs(velY) > MIN_VEL) targetRotY += velY;
    if (Math.abs(velX) > MIN_VEL) {
      targetRotX += velX;
      targetRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotX));
    }
  }
  /* 실제 회전값을 목표값으로 부드럽게 lerp */
  rotY += (targetRotY - rotY) * ROT_LERP;
  rotX += (targetRotX - rotX) * ROT_LERP;
  /* 포인터 라인 부드럽게 lerp */
  smoothX += (mouseScreenX - smoothX) * MOUSE_LERP;
  smoothY += (mouseScreenY - smoothY) * MOUSE_LERP;

  /* circle: 국가 snap 또는 마우스 따라감 */
  smoothCircX += (targetCircX - smoothCircX) * CIRCLE_LERP;
  smoothCircY += (targetCircY - smoothCircY) * CIRCLE_LERP;

  /* 화면 끝까지 연장: canvas 바깥 여백만큼 음수로 */
  const marginX = (window.innerWidth  - 1920 * currentScale) / 2;
  const marginY = (window.innerHeight - 1080 * currentScale) / 2;
  const extraX  = marginX / currentScale;
  const extraY  = marginY / currentScale;

  ptrH.setAttribute('x1', -extraX);      ptrH.setAttribute('y1', smoothY);
  ptrH.setAttribute('x2', 1920 + extraX); ptrH.setAttribute('y2', smoothY);
  ptrV.setAttribute('x1', smoothX);       ptrV.setAttribute('y1', -extraY);
  ptrV.setAttribute('x2', smoothX);       ptrV.setAttribute('y2', 1080 + extraY);
  /* circle은 항상 십자선 교차점 */
  ptrCirc.setAttribute('cx', smoothX);
  ptrCirc.setAttribute('cy', smoothY);

  /* feat 위치: 항상 가로 라인(smoothY) 기준 */
  if (feat1.style.opacity !== '0') {
    feat1.style.top = Math.max(70, smoothY - 30) + 'px';
    feat2.style.top = Math.max(70, smoothY - 1)  + 'px';
  }

  drawGlobe();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── Drag-to-rotate with inertia ── */
let isDragging = false, dragStartX = 0, dragStartY = 0, rotYStart = 0, rotXStart = 0;
let velY = 0, velX = 0;          /* 회전 속도 */
let prevDragX = 0, prevDragY = 0;
const DRAG_SENS   = 0.0025;
const FRICTION    = 0.82;
const MIN_VEL     = 0.00001;
const ROT_LERP    = 0.15;   /* 드래그 중 회전 부드러움 */

let targetRotY = rotY, targetRotX = rotX; /* 목표 회전값 */

hitarea.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  prevDragX  = e.clientX; prevDragY  = e.clientY;
  rotYStart  = rotY;      rotXStart  = rotX;
  targetRotY = rotY;      targetRotX = rotX;
  velY = 0; velX = 0;
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  mouseScreenX = (e.clientX - (window.innerWidth  - 1920 * currentScale) / 2) / currentScale;
  mouseScreenY = (e.clientY - (window.innerHeight - 1080 * currentScale) / 2) / currentScale;

  if (isDragging) {
    const dx = (e.clientX - dragStartX) / currentScale;
    const dy = (e.clientY - dragStartY) / currentScale;
    /* 목표값만 업데이트, 실제 회전은 루프에서 lerp */
    targetRotY = rotYStart + dx * DRAG_SENS;
    targetRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotXStart + dy * DRAG_SENS));

    velY = (e.clientX - prevDragX) / currentScale * DRAG_SENS;
    velX = (e.clientY - prevDragY) / currentScale * DRAG_SENS;
    prevDragX = e.clientX; prevDragY = e.clientY;
  }
});

window.addEventListener('mouseup', () => { isDragging = false; });

hitarea.addEventListener('mousemove', (e) => {
  const sx = (e.clientX - (window.innerWidth  - 1920 * currentScale) / 2) / currentScale;
  const sy = (e.clientY - (window.innerHeight - 1080 * currentScale) / 2) / currentScale;

  ptrSvg.style.opacity = '1';

  /* 가장 가까운 국가 탐색 */
  let nearest = null, nearDist = 40;
  COUNTRIES.forEach(c => {
    const matches = matchesFilter(c);
    if (!matches) return;
    const {x,y,z} = latLonToXYZ(c.lat, c.lon, rotY, rotX);
    if (z <= 0) return;
    const p = project(x, y, z);
    const scx = GLOB_SCREEN_X + p.sx, scy = GLOB_SCREEN_Y + p.sy;
    const d = Math.hypot(sx - scx, sy - scy);
    if (d < nearDist) { nearDist = d; nearest = { ...c, px: scx, py: scy }; }
  });

  hoveredCountry = nearest;

  /* circle 목표: 국가 근처면 snap, 아니면 마우스 */
  targetCircX = nearest ? nearest.px : sx;
  targetCircY = nearest ? nearest.py : sy;

  if (nearest) {
    feat1.style.opacity = '1'; feat2.style.opacity = '1';
    feat1.style.left = '17px'; feat2.style.left = '17px';
    feat1.textContent = nearest.continent;
    feat2.textContent = nearest.rhythm;
  } else {
    feat1.style.opacity = '0'; feat2.style.opacity = '0';
  }
});

hitarea.addEventListener('mouseleave', () => {
  ptrSvg.style.opacity = '0';
  feat1.style.opacity = '0'; feat2.style.opacity = '0';
  hoveredCountry = null;
});

hitarea.addEventListener('click', (e) => {
  const sx = (e.clientX - (window.innerWidth  - 1920 * currentScale) / 2) / currentScale;
  const sy = (e.clientY - (window.innerHeight - 1080 * currentScale) / 2) / currentScale;
  let nearest = null, nearDist = 30;
  COUNTRIES.forEach(c => {
    const {x,y,z} = latLonToXYZ(c.lat, c.lon, rotY, rotX);
    if (z <= 0) return;
    const p = project(x, y, z);
    const d = Math.hypot(sx - (GLOB_SCREEN_X + p.sx), sy - (GLOB_SCREEN_Y + p.sy));
    if (d < nearDist) { nearDist = d; nearest = c; }
  });
  if (nearest?.code === 'KR') window.location.href = 'index.html';
  if (nearest?.code === 'JP') window.location.href = '3.jp.html';
});

/* ── 필터 UI ── */
const filterEls = [...document.querySelectorAll('.filter-item')];

function updateFilterUI() {
  filterEls.forEach((el, idx) => {
    const item = FILTER_ITEMS[idx];
    if (!item) return;
    const isActive = item.type === 'continent'
      ? activeContinents.has(item.val)
      : activeRhythms.has(item.val);
    el.classList.toggle('active', isActive);
    el.classList.toggle('cursor', idx === filterCursor);
  });
}
updateFilterUI();

/* 클릭으로 개별 토글 */
filterEls.forEach((el, idx) => {
  el.addEventListener('click', () => {
    const item = FILTER_ITEMS[idx];
    if (!item) return;
    const set = item.type === 'continent' ? activeContinents : activeRhythms;
    if (set.has(item.val)) set.delete(item.val);
    else set.add(item.val);
    filterCursor = idx;
    updateFilterUI();
  });
});

/* ── 엔코더 E: 필터 커서 이동 ── */
function doFilterMove(dir) {
  filterCursor = (filterCursor + dir + FILTER_ITEMS.length) % FILTER_ITEMS.length;
  updateFilterUI();
}

/* ── 엔코더 E SW: 현재 커서 항목 토글 ── */
function doFilterToggle() {
  const item = FILTER_ITEMS[filterCursor];
  const set  = item.type === 'continent' ? activeContinents : activeRhythms;
  if (set.has(item.val)) set.delete(item.val);
  else set.add(item.val);
  updateFilterUI();
}

/* ── 엔코더 F/G: 국가 이동 후 중앙 배치 ── */
function shortestAngle(from, to) {
  const d = ((to - from) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
  return from + d;
}

function centerCountry(c) {
  focusedCountry = c;
  targetRotY = shortestAngle(targetRotY, Math.PI / 2 - c.lon * Math.PI / 180);
  targetRotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, c.lat * Math.PI / 180));
  velY = 0; velX = 0;
}

function findNeighbor(dir) {
  const visible = COUNTRIES.filter(c => {
    const { z } = latLonToXYZ(c.lat, c.lon, rotY, rotX);
    return z > 0 && matchesFilter(c);
  });
  if (!visible.length) return null;

  /* 포커스 없거나 화면 밖이면 화면 중앙에 가장 가까운 국가 반환 */
  if (!focusedCountry || !visible.find(c => c.code === focusedCountry.code)) {
    let best = null, bd = Infinity;
    visible.forEach(c => {
      const { x, y, z } = latLonToXYZ(c.lat, c.lon, rotY, rotX);
      const p = project(x, y, z);
      const d = Math.hypot(p.sx - CX, p.sy - CY);
      if (d < bd) { bd = d; best = c; }
    });
    return best;
  }

  const { x: fx, y: fy, z: fz } = latLonToXYZ(focusedCountry.lat, focusedCountry.lon, rotY, rotX);
  const fp = project(fx, fy, fz);
  let best = null, bs = Infinity;

  visible.forEach(c => {
    if (c.code === focusedCountry.code) return;
    const { x, y, z } = latLonToXYZ(c.lat, c.lon, rotY, rotX);
    const p = project(x, y, z);
    const dx = p.sx - fp.sx, dy = p.sy - fp.sy;
    let score;
    if      (dir === 'right' && dx >  5) score =  dx + Math.abs(dy) * 0.5;
    else if (dir === 'left'  && dx < -5) score = -dx + Math.abs(dy) * 0.5;
    else if (dir === 'down'  && dy >  5) score =  dy + Math.abs(dx) * 0.5;
    else if (dir === 'up'    && dy < -5) score = -dy + Math.abs(dx) * 0.5;
    else return;
    if (score < bs) { bs = score; best = c; }
  });
  return best;
}

/* ── 버튼 A: 국가 선택 ── */
function doSelectCountry() {
  const c = focusedCountry || hoveredCountry;
  if (!c) return;
  if (c.code === 'KR') window.location.href = 'index.html';
  else if (c.code === 'JP') window.location.href = '3.jp.html';
}

/* ── 키보드 ── */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Backspace') { e.preventDefault(); window.location.href = 'index.html'; }
  if (e.code === 'Enter')     { e.preventDefault(); doSelectCountry(); }
});

/* ── Web Serial ── */
let serialPort = null;
const serialBtn = document.getElementById('serial-btn');

function handleSerialCommand(cmd) {
  switch (cmd.trim()) {
    case 'CHANGE':                        window.location.href = 'index.html'; break;
    case 'PLAY':                          doSelectCountry(); break;
    /* 엔코더 E: 필터 커서 이동 */
    case 'VOL+': case 'SPD+':            doFilterMove(1);   break;
    case 'VOL-': case 'SPD-':            doFilterMove(-1);  break;
    /* 엔코더 E SW: 필터 토글 */
    case 'MODE_SPEED': case 'MODE_VOL':  doFilterToggle();  break;
    /* 엔코더 F: 좌우 국가 이동 */
    case 'COL+': case 'MOVE+': { const n = findNeighbor('right'); if (n) centerCountry(n); break; }
    case 'COL-': case 'MOVE-': { const n = findNeighbor('left');  if (n) centerCountry(n); break; }
    /* 엔코더 G: 상하 국가 이동 */
    case 'ROW+': { const n = findNeighbor('down'); if (n) centerCountry(n); break; }
    case 'ROW-': { const n = findNeighbor('up');   if (n) centerCountry(n); break; }
  }
}

async function connectSerial() {
  if (!('serial' in navigator)) { alert('Chrome / Edge를 사용해 주세요.'); return; }
  try {
    serialPort = await navigator.serial.requestPort();
    await serialPort.open({ baudRate: 9600 });
    serialBtn.textContent = '● CONNECTED';
    serialBtn.style.color = '#1a7a1a';
    serialBtn.style.borderColor = '#1a7a1a';
    const decoder = new TextDecoderStream();
    serialPort.readable.pipeTo(decoder.writable);
    const reader = decoder.readable.getReader();
    let buf = '';
    (async function readLoop() {
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          const lines = buf.split('\n');
          buf = lines.pop();
          lines.forEach(line => { if (line.trim()) handleSerialCommand(line); });
        }
      } catch (err) {
        serialBtn.textContent = '○ SERIAL';
        serialBtn.style.color = '#000';
        serialBtn.style.borderColor = '#000';
      }
    })();
  } catch (err) {
    if (err.name !== 'NotFoundError') console.error(err);
  }
}
